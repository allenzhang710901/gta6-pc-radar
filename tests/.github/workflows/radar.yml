name: Update radar and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  push:
    branches: [main]
    paths-ignore: ['site/data/state.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect and safely commit latest snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            pip install -r requirements.txt
            python -m unittest discover -s tests
            python scripts/update.py
            bytes=$(wc -c < site/data/state.json)
            if [ "$bytes" -ge 30000000 ]; then
              echo "::warning::State file exceeds 30 MB; archive migration is recommended before GitHub's file limit."
            fi
            git add site/data/state.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update radar snapshot'
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::Snapshot push failed; retrying from newest remote history ($attempt/3)."
            sleep 5
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
