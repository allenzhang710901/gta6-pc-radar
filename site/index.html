<section id="method"><div class="sectionhead"><h2 data-t="评分方法与限制|Scoring method and limitations"></h2></div><div class="panel"><p data-t="5.2评分：阶段、游戏内帧率、稳定性和操控的第三方证据分别按65%、45%（明确平均帧率55%）、55%、55%计入严格指数。声明分仍以原有里程碑计算；分数不是开发完成率或统计置信度。暂停、仓库不可访问及不再收录的项目保留历史分，但不参与活跃领先者评选。|5.2 scoring: secondary reports of milestones, in-game FPS, stability and control receive weights of 65%, 45% (55% for explicit averages), 55% and 55% respectively in the strict index. The reported index retains the original milestone model. Neither index is a completion percentage or a statistical confidence measure. Paused, inaccessible and unlisted projects retain historical scores but cannot lead active rankings."></p><p data-t="不把不同构建、不同测试、过场帧率或代码提交次数拼接为可玩证据。哈希链用于检测记录意外变化，不证明原始报告真实。两次扫描间出现又消失的内容可能无法捕获。|Different builds, tests, cutscene frame rates and commit counts are not combined as playability evidence. The hash chain detects accidental record changes, not the truth of reports. Changes that appear and disappear between scans may be missed."></p><p data-t="项目名称、来源名称和仓库标识保留原文；未翻译的原始资料仅在主动展开后显示。动态摘要采用规则生成，不是逐字机器翻译。|Project names, source names and repository identifiers retain their original form. Untranslated source material is shown only on demand. Dynamic summaries are rule-generated, not verbatim machine translations."></p></div></section>

let auditLimit=20,replayPinned=false;const kind=x=>({'baseline':t('初始基线','Initial baseline'),'project_added':t('新项目','New project'),'project_changed':t('证据变更','Evidence change'),'candidate':t('发现候选','Candidate discovered'),'event':t('公开动态','Public update'),'forecast':t('预测调整','Forecast change'),'source_status':t('来源状态','Source status')})[x]||t('记录','Record');function replay(){let l=state.ledger||[],n=Number($('replaySlider').value),m={};for(let r of l.slice(0,n))if(['baseline','project_added','project_changed'].includes(r.kind))m[r.project]=r.after;let sel=$('auditProject').value;let rows=Object.entries(m).filter(([k])=>sel==='all'||sel===k).sort((a,b)=>(b[1]?.score?.strict||0)-(a[1]?.score?.strict||0));$('replayLabel').textContent=n?`#${n} · ${date(l[n-1].at)}`:t('基线之前','Before baseline');$('replayRows').innerHTML=rows.map(([k,v])=>`<div><strong>${esc(v.name||k)}</strong><br><span class="score">${v.score?.strict??0}%</span> <small>${t('声明','Reported')} ${v.score?.reported??0}%</small></div>`).join('')||`<small>${t('此时没有匹配记录','No matching records at this point')}</small>`}
function auditDiff(a,b){const fields=[['strict',t('严格指数','Strict index')],['reported',t('声明指数','Reported index')],['stage',t('技术阶段','Stage')],['fps',t('游戏内帧率','In-game FPS')],['minutes',t('无崩溃分钟','Crash-free minutes')],['control',t('操控','Control')],['halted',t('暂停','Paused')],['status',t('状态','Status')],['policy',t('评分规则版本','Scoring policy')],['source_health',t('来源状态','Source health')]];const val=v=>v==null?t('未知','Unknown'):typeof v==='boolean'?(v?t('是','Yes'):t('否','No')):String(v);return fields.filter(([k])=>a?.[k]!==b?.[k]).map(([k,l])=>`<small>${l}</small><div class="diff"><div>${esc(val(a?.[k]))}</div><div>${esc(val(b?.[k]))}</div></div>`).join('')};function renderAudit(){let l=state.ledger||[],sel=$('auditProject'),old=sel.value,keys=[...new Set(l.map(r=>r.project))].sort();sel.innerHTML=`<option value="all">${t('全部项目 / 来源','All projects / sources')}</option>`+keys.map(k=>`<option value="${esc(k)}">${esc(state.projects[k]?.name||k)}</option>`).join('');sel.value=keys.includes(old)?old:'all';$('auditCount').textContent=l.length+' '+t('条记录（含基线）','records (including baseline)');$('replaySlider').max=l.length;if(!replayPinned)$('replaySlider').value=l.length;replay();let list=l.filter(r=>(sel.value==='all'||sel.value===r.project)&&($('auditKind').value==='all'||$('auditKind').value===r.kind)).reverse();$('auditRows').innerHTML=list.slice(0,auditLimit).map(r=>{let a=r.before?.score,b=r.after?.score,d=a&&b?b.strict-a.strict:null;return `<article class="event"><div class="row"><span class="tag">#${r.seq} · ${esc(kind(r.kind))}</span><small>${esc(date(r.at))}</small></div><h3>${esc(state.projects[r.project]?.name||r.project)} ${d!==null?`<span class="${d>0?'up':d<0?'down':'muted'}">${d>0?'+':''}${d} ${t('分','pts')}</span>`:''}</h3>${r.kind==='baseline'?`<p>${t('导入历史快照，不代表新突破。','Imported historical snapshot; not a new breakthrough.')}</p>`:r.kind==='project_changed'?auditDiff(a,b):r.kind==='event'?`<p>${esc(eventTitle(r.after||{}))}</p>`:r.kind==='forecast'?`<p>${esc(forecastText(r.after?.text))}</p>`:''}${link(b?.url||r.after?.url||r.before?.url,t('证据出处 ↗','Evidence source ↗'))}<details><summary>${t('原始逐字段记录与校验值（原语言）','Original field-level record and hash')}</summary><pre>${esc(JSON.stringify({before:r.before,after:r.after,prev:r.prev,hash:r.hash},null,2))}</pre></details><small>${esc(r.hash?.slice(0,16)||'')}…</small></article>`}).join('')||`<div class="empty">${t('没有匹配记录','No matching records')}</div>`;$('auditMore').hidden=list.length<=auditLimit}
function renderSources(){let hs=Object.entries(state.health||{});let status=x=>({ok:t('成功','Success'),snapshot:t('参考快照','Reference snapshot'),partial:t('部分成功','Partial success'),error:t('连接失败','Connection failed'),skipped:t('跳过','Skipped'),disabled:t('未启用','Disabled')})[x]||t('待确认','Pending');$('health').innerHTML=hs.map(([n,v])=>`<div><strong>${esc(n)}</strong><br><span class="tag ${v.status==='ok'?'good':'warn'}">${status(v.status)}</span><br><small>${esc(date(v.checked||v.upstream))}</small>${original(v.error)}</div>`).join('');$('historyLabel').textContent=(state.history||[]).length?t('累计扫描记录：','Scan records: ')+(state.history||[]).length:t('部署后生成扫描历史。','Scan history appears after deployment.')}
function localize(){document.documentElement.lang=t('zh-CN','en');document.title=t('GTA VI · 进度雷达','GTA VI · Progress Radar');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tx(el.dataset.t));document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=tx(el.dataset.ph);el.setAttribute('aria-label',el.placeholder)});$('zh').setAttribute('aria-pressed',lang==='zh');$('en').setAttribute('aria-pressed',lang==='en');$('replaySlider').setAttribute('aria-label',t('历史回放','History replay'));render()};function detailKey(el){let parent=el.closest('tr,article');return parent?(parent.querySelector('h3,strong')?.textContent||'')+'|'+[...parent.querySelectorAll('details')].indexOf(el):el.parentElement?.id||''}function render(){let open=new Set([...document.querySelectorAll('details[open]')].map(detailKey));renderOverview();renderProjects();renderEvents();renderLadder();renderAudit();renderSources();document.querySelectorAll('details').forEach(el=>{if(open.has(detailKey(el)))el.open=true})};function setLang(x){lang=x;try{localStorage.setItem('radarLang',x)}catch{}localize()};$('zh').onclick=()=>setLang('zh');$('en').onclick=()=>setLang('en');function validState(d){if(!d||typeof d.projects!=='object'||!d.projects||Array.isArray(d.projects)||!Object.keys(d.projects).length||!Array.isArray(d.events)||!Array.isArray(d.ledger)||!Array.isArray(d.candidates)||!Array.isArray(d.history)||!d.health||!Number.isFinite(Date.parse(d.checked))||Date.parse(d.checked)>Date.now()+300000)return false;return Object.values(d.projects).every(p=>p&&typeof p.name==='string'&&p.audit_score&&['stage','strict','reported'].every(k=>Number.isFinite(p.audit_score[k])&&p.audit_score[k]>=0&&p.audit_score[k]<=(k==='stage'?7:100)))&&d.events.every(e=>e&&typeof e.id==='string')&&d.ledger.every((r,i)=>r&&r.seq===i+1&&typeof r.hash==='string'&&r.prev===(i?d.ledger[i-1].hash:'GENESIS'))&&d.candidates.every(c=>c&&typeof c.repo==='string')&&Object.values(d.health).every(h=>h&&typeof h.status==='string')}
let refreshing=false;async function refresh(){if(PREVIEW||location.protocol==='file:'){render();return}if(refreshing)return;refreshing=true;try{let d;let error;for(const url of DATA_URLS){try{let r=await fetch(url+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error(r.status);let candidate=await r.json();if(!validState(candidate))throw Error('invalid state');if(state.checked&&(Date.parse(candidate.checked)<Date.parse(state.checked)||candidate.ledger.length<(state.ledger||[]).length))throw Error('older state');d=candidate;break}catch(e){error=e}}if(!d)throw error||Error('no live data');let previous=state;try{if(state.checked!==d.checked||state.ledger?.at(-1)?.hash!==d.ledger.at(-1)?.hash){state=d;render()}else renderOverview()}catch(e){state=previous;render();throw e}}catch(e){$('indicator').textContent=t('读取失败 · 保留旧数据','Load failed · Keeping previous data');$('indicator').className='status warn'}finally{refreshing=false}};$('refresh').onclick=refresh;$('rankMore').onclick=()=>{rankExpanded=!rankExpanded;renderProjects()};['search','filter','sort'].forEach(k=>$(k).addEventListener('input',renderProjects));['eventSearch','eventFilter'].forEach(k=>$(k).addEventListener('input',()=>{maxEvents=20;renderEvents()}));$('more').onclick=()=>{maxEvents+=30;renderEvents()};['fastPace','slowPace'].forEach(k=>$(k).addEventListener('input',()=>{renderOverview();renderProjects()}));['auditProject','auditKind'].forEach(k=>$(k).onchange=()=>{auditLimit=20;renderAudit()});$('auditMore').onclick=()=>{auditLimit+=40;renderAudit()};$('replaySlider').oninput=()=>{replayPinned=Number($('replaySlider').value)!==(state.ledger||[]).length;replay()};localize();refresh();setInterval(refresh,20000);
</script></body></html>
